name: ResearchPilot checks
on:
  push:
    paths: ['apps/researchpilot/**', '.github/workflows/researchpilot.yml']
  pull_request:
    paths: ['apps/researchpilot/**', '.github/workflows/researchpilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/researchpilot
    env:
      RP_MODE: offline
      RP_DATA_DIR: ./data-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Check frontend syntax
        run: >-
          python -c "import pathlib,subprocess; [subprocess.run(['node','--check',str(p)],check=True) for p in pathlib.Path('frontend').glob('*.js')]"
      - run: python scripts/build_release.py
